name: Chan Strategy Multi-Index Scan

on:
  workflow_dispatch:
    inputs:
      index_type:
        description: '选择要扫描的指数'
        required: true
        default: 'HSI'
        type: choice
        options:
          - HSI
          - NDX
          - SP500
          - HS300
          - ZZ500
          
  schedule:
    # 每天北京时间 16:30 自动扫描一次恒生指数 (UTC 08:30)
    - cron: '30 8 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 确保安装了所有需要的库
        pip install pandas numpy yfinance plotly akshare lxml

    - name: Run Strategy
      # 获取输入参数，如果没有输入（定时触发）则默认 HSI
      run: python main.py ${{ github.event.inputs.index_type || 'HSI' }}

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
