name: Chan Strategy Web Report

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch: 

# 必须设置权限以允许发布网页
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance plotly

    - name: Run Strategy
      run: python main.py

    # 将生成的 index.html 发布到 gh-pages 分支
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages  # 网页部署在 gh-pages 分支
