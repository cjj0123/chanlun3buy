name: Chan Strategy Daily Scan

on:
  push:
    branches: [ main ]
  schedule:
    # 每天周一到周五北京时间晚上 18:00 运行 (UTC 10:00)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance akshare

    - name: Run Strategy
      run: python main.py

    - name: Send mail
      uses: dawidd6/action-send-mail@v3
      with:
        # 这里以 QQ 邮箱为例，如果是 Gmail 请参考下方说明
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{secrets.MAIL_USERNAME}}
        password: ${{secrets.MAIL_PASSWORD}}
        subject: 缠论三买选股报告 - 恒生科技 (${{github.run_id}})
        to: ${{secrets.MAIL_USERNAME}} # 发给自己
        from: GitHub Actions Strategy
        body: |
          你好，
          
          今日恒生科技指数 30分钟 级别缠论三买选股扫描已完成。
          详细结果请查看附件 results.txt。
          
          运行编号: ${{github.run_id}}
        attachments: results.txt
