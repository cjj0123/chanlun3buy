name: Chan Strategy Daily Scan

on:
  push:
    branches: [ main ]
  schedule:
    # 每天周一到周五，北京时间晚上 8 点运行 (UTC 12:00)
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Strategy
      run: python main.py
